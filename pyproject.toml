[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "malow"
version = "0.1.0"
description = "MaLoW: Memory as LoRA Weights"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSES/*.txt"]
dependencies = []

[project.urls]
Repository = "https://github.com/dragonlzm/MaLoW"

[tool.setuptools.packages.find]
where = ["src"]
include = ["malow*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
malow = ["release_models.json"]
